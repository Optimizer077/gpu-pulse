<!DOCTYPE html>
<!-- Dev-only harness: renders the real dashboard with synthetic data in a normal browser.
     Open with ?light for the light theme. Not shipped in the .vsix. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../media/dashboard.css">
<title>GPU Pulse preview</title>
</head>
<body class="vscode-dark">
<script>
  if (location.search.includes('light')) document.body.className = 'vscode-light';
  window.acquireVsCodeApi = () => ({ postMessage(m) { console.log('[to host]', JSON.stringify(m)); }, getState() {}, setState() {} });
</script>
<div id="app"></div>
<script src="../media/charts.js"></script>
<script src="../media/dashboard.js"></script>
<script>
// ?real -> use the fixture written by `npm run smoke` (real hardware readings).
if (location.search.includes('real')) {
  const s = document.createElement('script');
  s.src = '../dist/preview-data.js';
  s.onload = () => window.postMessage(window.PREVIEW_INIT, '*');
  document.body.appendChild(s);
} else (function () {
  const now = Date.now();
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  // Training-like pattern: busy plateaus with dataloader dips.
  const util = (t) => {
    const m = (t / 60000) % 240;
    if (m < 40) return 2 + rnd() * 4;
    const base = 78 + 14 * Math.sin(t / 47000);
    return Math.max(0, Math.min(100, base - (rnd() < 0.12 ? 55 * rnd() : 0) + rnd() * 6));
  };
  const recent = [];
  for (let t = now - 3600e3; t <= now; t += 1000) {
    const u = util(t);
    recent.push([t, Math.round(u), u > 10 ? 71 + rnd() * 2 : 32, 18 + rnd() * 22 + u * 0.2, 46 + rnd()]);
  }
  const start = Math.floor(now / 60000) * 60000 - (25 * 60 - 1) * 60000;
  const cells = [];
  for (let i = 0; i < 25 * 60; i++) {
    const t = start + i * 60000;
    const hr = new Date(t).getHours();
    cells.push(hr >= 2 && hr < 8 ? null : Math.round(util(t) * 10) / 10);
  }
  const gpu = { index: 0, uuid: 'GPU-1', name: 'NVIDIA GeForce RTX 5060 Ti', vendor: 'nvidia', util: 87, memUtil: 41, memUsedMiB: 11720,
    memTotalMiB: 16311, tempC: 66, powerW: 151.4, powerLimitW: 180, clockMHz: 2842, clockMaxMHz: 3090, memClockMHz: 14001,
    fanPct: 58, pstate: 'P2', pcieGen: 4, pcieWidth: 8 };
  const cores = Array.from({ length: 20 }, (_, i) => Math.round(15 + 70 * Math.abs(Math.sin(i * 1.7))));
  const sample = { t: now, gpus: [gpu], cpu: { util: 38, perCore: cores }, mem: { usedBytes: 31.7 * 2 ** 30, totalBytes: 63.65 * 2 ** 30 } };
  const W = (label, minutes, covered, u, idle, busy) => ({ label, minutes, coveredMinutes: covered, util: u, utilPeak: 100, vram: 64,
    power: 128, tempPeak: 71, idleShare: idle, busyShare: busy, heldIdleShare: 0.04, cpu: 34, mem: 48 });
  window.postMessage({
    type: 'init', selected: 'GPU-1', vendor: 'nvidia', platform: 'linux', config: { tempWarn: 80, intervalMs: 1000 }, sample, recent,
    heatmap: { start, cells }, processes: [
      { pid: 48211, name: 'python', usedMiB: 9842, gpuUuid: 'GPU-1' },
      { pid: 3102, name: 'jupyter-kernel', usedMiB: 1418, gpuUuid: 'GPU-1' },
      { pid: 1931, name: 'Xorg', usedMiB: 312, gpuUuid: 'GPU-1' },
    ],
    windows: [W('5 min', 5, 5, 84.2, 0.03, 0.82), W('30 min', 30, 30, 79.5, 0.07, 0.74), W('1 hour', 60, 60, 61.3, 0.27, 0.55), W('24 hours', 1440, 1080, 52.8, 0.31, 0.46)],
    grade: { label: 'Well used', level: 'good' },
    insights: [
      { level: 'good', title: 'GPU kept busy', detail: 'Above 70% utilization for 55% of the last hour (mean 61%).' },
      { level: 'warning', title: 'Peaked at 81 °C this hour', detail: 'Above your 80 °C threshold at least once in the last hour.' },
      { level: 'info', title: 'High utilization, low power draw', detail: 'Utilization counts time any kernel runs, not how many cores are busy.' },
    ],
    specs: { hostname: 'gpu-box-01', os: 'Ubuntu 22.04.4 LTS', kernel: '6.8.0-45-generic', arch: 'x64', uptimeSec: 71306,
      cpu: { model: 'Intel Core Ultra 7 265F', cores: 20, threads: 20, baseGHz: 2.4, maxGHz: 5.3 },
      memory: { totalBytes: 68344610816, modules: ['32 GB · DDR5 · 5600 MT/s · Micron Technology', '32 GB · DDR5 · 5600 MT/s · Micron Technology'] },
      board: 'HP 8D34', system: 'HP OMEN 16L Gaming Desktop', disks: [{ name: 'SAMSUNG MZVL81T0HFLB', sizeBytes: 1024203640320, type: 'NVMe' }],
      gpus: [{ name: 'NVIDIA GeForce RTX 5060 Ti', vramMiB: 16311, driver: '591.74', vbios: '98.06.1f.00.f0', extra: ['NVIDIA', 'PCI'] }],
      cudaVersion: '13.1', remote: 'ssh-remote' },
  }, '*');
})();
</script>
</body>
</html>
