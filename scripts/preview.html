<!DOCTYPE html>
<!-- Dev-only harness: renders the real dashboard with synthetic data in a normal browser. Not shipped in the .vsix.
     Query parameters:
       ?gpus=4        synthetic GPU count (default 1; the last GPU lags when there are several)
       &light         light theme
       &interval=250  live tick interval in ms (default 500)
       &static        no live ticks (stable screenshots)
       &real          use the fixture written by `npm run smoke` (real hardware readings)
       &bench=10      count canvas draws / DOM mutations / JS time for 10 s, print JSON into #bench-out
       &legacy        send v0.1.0-style messages (full analysis every tick) to compare against an old dashboard.js -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../media/dashboard.css">
<title>GPU Pulse preview</title>
<script src="preview-host.js"></script>
</head>
<body class="vscode-dark">
<script>if (location.search.includes('light')) document.body.className = 'vscode-light';</script>
<div id="app"></div>
<script src="../media/charts.js"></script>
<script src="../media/dashboard.js"></script>
<script>
  // Registered after the dashboard's listener, so this measures its message handling time.
  window.addEventListener('message', () => { if (window.__bench._t0 != null) window.__bench.handlerMs += performance.now() - window.__bench._t0; });
</script>
</body>
</html>
