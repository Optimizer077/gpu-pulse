[project]
name = "gpu-pulse"
version = "0.1.0"
description = "Terminal GPU dashboard: live usage, 5m/30m/1h/24h averages, utilization insights and machine specs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GPU Pulse contributors" }]
keywords = ["gpu", "nvidia", "monitor", "terminal", "tui", "nvidia-smi", "machine-learning"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "textual>=0.80",
    "rich>=13.7",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/Optimizer077/gpu-pulse"
Source = "https://github.com/Optimizer077/gpu-pulse/tree/main/pip"
Issues = "https://github.com/Optimizer077/gpu-pulse/issues"
Releases = "https://github.com/Optimizer077/gpu-pulse/releases"

[project.scripts]
gpu-pulse = "gpu_pulse.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "types-psutil"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/gpu_pulse", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Keep typing.Optional: the package supports Python 3.9 at runtime.
ignore = ["UP045", "UP007"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
